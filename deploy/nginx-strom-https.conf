# HTTPS for https://alumen.eu.corp.airliquide.com (certificate from the
# Air Liquide internal PKI). Replaces nginx-strom.conf once the certificate is
# installed in /etc/nginx/alumen-ssl/:
#   alumen.key            private key (generated on this machine, never copied)
#   alumen-fullchain.pem  server certificate + "Servers and Applications Issuing CA"

# Port 80 only redirects: any name or the raw IP lands on the HTTPS name, which
# is the only one the certificate covers.
server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;
    return 301 https://alumen.eu.corp.airliquide.com$request_uri;
}

server {
    listen       443 ssl default_server;
    listen       [::]:443 ssl default_server;
    server_name  alumen.eu.corp.airliquide.com;
    client_max_body_size 100M;

    ssl_certificate     /etc/nginx/alumen-ssl/alumen-fullchain.pem;
    ssl_certificate_key /etc/nginx/alumen-ssl/alumen.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # "https" here is what makes the /login redirect stay on https
        # (publicUrl in src/middleware.ts).
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Alumen - adiciona regras de entrada ao Security Group que ja esta ligado a
  EC2 do Alumen. Nao cria SG novo e nao mexe na instancia: so acrescenta
  HTTP (80) e, opcionalmente, SSH (22) ao SG existente.

Parameters:
  InstanceSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: >-
      SG que esta ligado a EC2 do Alumen (EC2 > Instances > a maquina >
      aba Security > Security groups).
  HttpCidr:
    Type: String
    Default: 10.0.0.0/8
    AllowedPattern: '^\d{1,3}(\.\d{1,3}){3}/\d{1,2}$'
    Description: >-
      Quem pode abrir o Alumen na porta 80. 10.0.0.0/8 = rede interna,
      inclui a maquina de tunel. Nao use 0.0.0.0/0.
  SshCidr:
    Type: String
    Default: ''
    Description: >-
      Opcional. CIDR liberado na porta 22 (ex. 10.20.30.40/32). Vazio = nao
      cria a regra.

Conditions:
  HasSsh: !Not [!Equals [!Ref SshCidr, '']]

Resources:
  HttpIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref InstanceSecurityGroupId
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: !Ref HttpCidr
      Description: Alumen HTTP via nginx

  SshIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasSsh
    Properties:
      GroupId: !Ref InstanceSecurityGroupId
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      CidrIp: !Ref SshCidr
      Description: Alumen SSH

Outputs:
  SecurityGroupId:
    Description: SG que recebeu as regras.
    Value: !Ref InstanceSecurityGroupId
